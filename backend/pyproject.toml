[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rayen-segni", email = "snrayen8@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[all]>=0.142.2",
    "hiero-did-sdk-python==0.1.7",
    "hiero-sdk-python==0.2.2",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "requests>=2.31.0",
    "scikit-learn==1.9.1",
    "solc-select",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

# Add this line to disable package auto-discovery:
[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"
